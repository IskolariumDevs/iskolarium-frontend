<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Iskolarium — Direct messages with fellow scholars.">
  <title>Iskolarium – Messages</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body id="messages-page">

  <!-- NAV -->
  <nav>
    <div class="logo">🌅 ISKOLARIUM</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="scholarships.html">Scholarships</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="forum.html">Forum</a>
      <a href="messages.html" class="active">Messages</a>
      <a href="login.html" id="loginNavLink">Login</a>
      <span id="userWelcome" style="display:none;"></span>
      <button id="logoutBtn" onclick="logout()" style="display:none;" class="nav-btn">Logout</button>
    </div>
  </nav>

  <div class="container">

    <div class="page-header">
      <h1>💌 Private Messages</h1>
      <p>Direct messages with fellow scholars</p>
    </div>

    <div class="messages-container">

      <!-- SIDEBAR -->
      <div class="conversations-sidebar">
        <div class="conversations-header">
          <h3>Chats</h3>
          <button onclick="newConversation()" class="new-msg-btn">✎</button>
        </div>
        <div id="conversationsList" class="conversations-list"></div>
      </div>

      <!-- MESSAGE AREA -->
      <div class="message-area">

        <div id="noConversationSelected" class="no-conversation">
          <div class="empty-icon">💬</div>
          <h3>Select a conversation</h3>
          <p>Choose a conversation from the left to start messaging</p>
        </div>

        <div id="conversationView" style="display:none;">
          <div class="conversation-header" id="conversationHeader">
            <h3 id="chatWithName">Loading...</h3>
          </div>
          <div id="messagesList" class="messages-list"></div>
          <div class="message-input-area">
            <textarea id="messageInput" rows="1" placeholder="Aa" onkeypress="handleEnterKey(event)"></textarea>
            <button onclick="sendMessage()" class="send-btn">➤</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- NEW CONVERSATION MODAL -->
  <div id="newConversationModal" class="modal" style="display:none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Start New Conversation</h3>
        <button onclick="closeModal()" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <label>Search for user:</label>
        <input type="text" id="searchUser" placeholder="Enter username or email" onkeyup="searchUsers()">
        <div id="searchResults" class="search-results"></div>
      </div>
      <div class="modal-footer">
        <button onclick="closeModal()" class="btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    if (!localStorage.getItem('userEmail')) {
      alert('Please log in or register to access community features.');
      window.location.href = 'login.html';
    }

    window.onload = function() {
      checkLoginStatusOnPage();
      loadConversations();
      
      // Task 4: Check for pending recipient from forum redirect
      const pendingUserId = sessionStorage.getItem('pendingUserId');
      const pendingUserName = sessionStorage.getItem('pendingUserName');
      
      if (pendingUserId && pendingUserName) {
        sessionStorage.removeItem('pendingUserId');
        sessionStorage.removeItem('pendingUserName');
        startConversation(parseInt(pendingUserId), pendingUserName);
      }
    }
    
    // Task 2: Stop auto-refresh when leaving page
    window.onbeforeunload = function() {
      if (typeof stopMessageAutoRefresh === 'function') {
        stopMessageAutoRefresh();
      }
    }

    function handleEnterKey(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    function newConversation() {
      if (!checkAuthAndRedirect()) return;
      document.getElementById('newConversationModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('newConversationModal').style.display = 'none';
    }
    
    function checkAuthAndRedirect() {
      if (!localStorage.getItem('token')) {
        alert('Please log in to send messages.');
        window.location.href = 'login.html';
        return false;
      }
      return true;
    }
  </script>
</body>
<script src="script.js"></script>
</html>
