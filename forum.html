<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>IskolarHub - ISKOMMUNITY Forum</title>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body id="forum-page">
    <nav>
        <div class="logo">📚 ISKOLARIUM</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="forum.html" class="active">Forum</a>
            <a href="messages.html">Messages</a>
            <a href="login.html" id="loginNavLink">Login</a>
            <span id="userWelcome" style="display:none;"></span>
            <button id="logoutBtn" onclick="logout()" style="display:none;" class="nav-btn">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>💬 ISKOMMUNITY</h1>
            <p>Connect with fellow scholars, ask questions, and share tips</p>
        </div>

        <!-- Create Post Form -->
        <div class="create-post-card">
            <h3>Create a Post</h3>
            <textarea id="postContent" rows="3" placeholder="Share something with the community... (e.g., tips, questions, experiences)"></textarea>
            <div class="post-options">
                <label class="checkbox-label">
                    <input type="checkbox" id="anonymousPost"> Post anonymously
                </label>
                <button onclick="createPost()" class="btn-primary">📝 Post to Community</button>
            </div>
        </div>

        <!-- Filter Bar -->
        <div class="forum-filter">
            <button id="showAllBtn" class="filter-active" onclick="filterPosts('all')">All Posts</button>
            <button id="showResolvedBtn" class="filter-btn" onclick="filterPosts('resolved')">Resolved</button>
            <button id="showUnresolvedBtn" class="filter-btn" onclick="filterPosts('unresolved')">Unresolved</button>
            <button id="showMyPostsBtn" class="filter-btn" onclick="filterPosts('myposts')">My Posts</button>
        </div>

        <!-- Posts List -->
        <div id="forumPosts"></div>

        <!-- Loading State -->
        <div id="loadingPosts" class="loading-state">
            <p>Loading community posts...</p>
        </div>
    </div>

    <script>
        window.onload = function() {
            checkLoginStatusOnPage();
            loadForum();
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
