<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Iskolarium — Sign in to continue your scholarship journey.">
  <title>Iskolarium – Welcome Back</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body id="login-page">

  <!-- NAV -->
  <nav>
    <div class="logo">🌅 ISKOLARIUM</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="scholarships.html">Scholarships</a>
      <a href="register.html">Register</a>
    </div>
  </nav>

  <div class="login-wrapper">
    <div class="login-card">

      <div class="login-header">
        <span class="login-icon">🎓</span>
        <h2>Welcome Back</h2>
        <p>Continue your journey towards your dreams</p>
      </div>

      <form id="loginForm" class="login-form">
        <div class="input-group">
          <label for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" placeholder="your.email@example.com" required>
        </div>
        <div class="input-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="login-btn">
          <span>Sign In</span>
          <span class="btn-icon">→</span>
        </button>
      </form>

      <div class="register-link">
        Don't have an account? <a href="register.html">Create one here</a>
      </div>

      <div id="loginMessage" class="message-box"></div>

    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
